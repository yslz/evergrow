<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Evergrow</title>
  <link rel="stylesheet" href="./visual/style.css" />
</head>
<script>
  function saveAndReload() {
    const fpsInput = document.getElementById('fpsInput');
    const nodeInput = document.getElementById('nodeCountInput');

    if (fpsInput) {
      localStorage.setItem('evergrow_fps', fpsInput.value);
    }
    if (nodeInput) {
      localStorage.setItem('evergrow_nodes', nodeInput.value);
    }

    location.reload();
  }
</script>

<body>
  <canvas id="evergrow"></canvas>
  <script type="module" src="./visual/main.js"></script>
  <div style="position:fixed; top:10px; right:10px; color:white; z-index:9999;">
  Tick(ms): <input id="fpsInput" type="number" value="33" style="width:60px;">
  Nodes: <input id="nodeCountInput" type="number" value="1000" style="width:80px;">
  <button onclick="saveAndReload()">Apply</button>
  </div>

</body>
</html>
